name: update-data-and-deploy
on:
  schedule:
    # GitHub cron 使用 UTC。台灣時間 = UTC+8
    # 08:00→00:00、10:00→02:00、12:00→04:00、18:00→10:00、22:00→14:00
    - cron: '0 0,2,4,10,14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['00631L-dashboard-repo/**', '.github/workflows/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 抓取資料
        run: python 00631L-dashboard-repo/scripts/fetch_data.py
      - name: 提交資料
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add 00631L-dashboard-repo/docs/data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%FT%TZ)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: 00631L-dashboard-repo/docs }
      - id: deployment
        uses: actions/deploy-pages@v4
